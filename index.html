        <script>
            function myFunction() {
                var x = document.getElementById("myLinks");
                if (x.style.display === "block") {
                    x.style.display = "none";
                } else {

                }
            }
        </script>

        <script>
            function showMenu() { 
                var x = document.querySelectorAll(".tab_links, .outlinks, .tab_dividers")
                for (i=0; i<x.length; i++) {
                    if (x[i].style.display === "block") {
                        x[i].style.display = "none";
                    } else {
                        x[i].style.display = "block";
                    }
                }
            }
        </script>
        <script>
//Play an animation back on second click

let iconMenu = document.querySelector('.bodymovinanim');

    let animationMenu = bodymovin.loadAnimation({
            container: iconMenu,
            renderer: 'svg',
            loop: false,
            autoplay: false,
            path: "https://raw.githubusercontent.com/thesvbd/Lottie-examples/master/assets/animations/menu.json"
    });

    var directionMenu = 1;
      iconMenu.addEventListener('click', (e) => {
        animationMenu.setDirection(directionMenu);
        animationMenu.play();
        showMenu()
        directionMenu = -directionMenu;
    });
        </script>
